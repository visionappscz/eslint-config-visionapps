name: Pull Request Meta

on:
  pull_request:
    types: [ opened ]

jobs:
  process_pr_meta:
    name: Process PR meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add labels
        uses: TimonVS/pr-labeler-action@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
